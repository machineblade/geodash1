                this.windowHeight = window.innerHeight;
                if ((this.windowHeight / DESIGN_HEIGHT) > (this.windowWidth / DESIGN_WIDTH)) {
                    this.designWidth = DESIGN_WIDTH;
                    this.designHeight = Math.ceil(this.windowHeight / (this.windowWidth / DESIGN_WIDTH));
                } else {
                    this.designWidth = Math.ceil(this.windowWidth / (this.windowHeight / DESIGN_HEIGHT));
                    this.designHeight = DESIGN_HEIGHT;
                }
                this.scaleFactorWidth = this.designWidth / DESIGN_WIDTH;
                this.scaleFactorHeight = this.designHeight / DESIGN_HEIGHT;
                this.scaleFactorMin = Math.min(this.scaleFactorWidth, this.scaleFactorHeight);
                this.scaleFactorMax = Math.max(this.scaleFactorWidth, this.scaleFactorHeight);
                this.app.stage.scale.set(
                    this.windowWidth / this.designWidth,
                    this.windowHeight / this.designHeight
                );
                if (this.onResize) this.onResize();
            }
        }

        class Background extends PIXI.Container {
            build() {
                this.background = new PIXI.TilingSprite({
                    texture: PIXI.Assets.get("background"),
                    applyAnchorToTexture: true,
                });
                this.background.anchor.y = 1;
                this.background.tint = 0x0066ff;
                this.addChild(this.background);

                this.groundContainer = new PIXI.Container();

                this.ground = new PIXI.TilingSprite({
                    texture: PIXI.Assets.get("ground"),
                    height: 90,
                });
                this.ground.tileScale.set(128 / this.ground.texture.frame.width);
                this.ground.tint = 0x0066ff;
                this.groundContainer.addChild(this.ground);

                // Left shadow — gradient fades right, so dark is on the left edge
                const leftShadow = new PIXI.Sprite(PIXI.Assets.get("groundshadow"));
                leftShadow.position.x = -1;
                leftShadow.setSize(128);
                leftShadow.scale.x *= 0.7;
                leftShadow.alpha = 0.4;
                this.groundContainer.addChild(leftShadow);

                // Right shadow — flipped horizontally so dark is on the right edge
                this.rightShadow = new PIXI.Sprite(PIXI.Assets.get("groundshadow"));
                this.rightShadow.setSize(128);
                this.rightShadow.scale.x *= -0.7;
                this.rightShadow.alpha = 0.4;
                this.groundContainer.addChild(this.rightShadow);

                // Ground line — white with alpha from brightness, centered
                this.line = new PIXI.Sprite(PIXI.Assets.get("groundline"));
                this.line.anchor.x = 0.5;
                this.line.scale.set(444 / this.line.width);
                this.groundContainer.addChild(this.line);

                this.addChild(this.groundContainer);
            }

            layout(width, height, scaleFactorMax) {
                this.background.width = width;
                this.background.height = height;
                this.background.position.y = height;
                this.background.tileScale.set(512 / this.background.texture.frame.width * scaleFactorMax);

                this.ground.width = width;
                this.rightShadow.position.x = width + 1;
                this.line.position.x = width / 2;
                this.groundContainer.y = height - 90;
            }
        }

        const app = new PIXI.Application();
        await app.init({
            width: window.innerWidth,
            height: window.innerHeight,
            backgroundColor: 0x000000,
            resizeTo: window,
            antialias: true,
        });
        document.body.appendChild(app.canvas);

        const director = new Director(app);

        await PIXI.Assets.load([
            { alias: "background", src: IMG_BACKGROUND },
            { alias: "ground", src: IMG_GROUND },
            { alias: "groundline", src: IMG_GROUNDLINE },
            { alias: "groundshadow", src: IMG_GROUNDSHADOW },
            { alias: "logo", src: IMG_LOGO },
            { alias: "logo2", src: IMG_LOGO2 },
        ]);

        const bg = new Background();
        bg.build();
        app.stage.addChild(bg);

        // Logo — centered horizontally, 40 design units from top
        const logo = new PIXI.Sprite(PIXI.Assets.get("logo"));
        logo.anchor.set(0.5, 0);
        app.stage.addChild(logo);

        const logo2 = new PIXI.Sprite(PIXI.Assets.get("logo2"));
        logo2.anchor.set(0.5, 0);
        app.stage.addChild(logo2);

        function doLayout() {
            bg.layout(director.designWidth, director.designHeight, director.scaleFactorMax);
            // Logo 1 (Quant'm) — ~150 wide
            const targetW = 105;
            logo.scale.set(targetW / logo.texture.width);
            const logo1H = logo.texture.height * logo.scale.y;
            logo.position.set(director.designWidth / 2, 40);
            // Logo 2 (Quantum Dash) — ~230 wide, 20 points below logo 1
            const targetW2 = 300;
            logo2.scale.set(targetW2 / logo2.texture.width);
            logo2.position.set(director.designWidth / 2, 40 + logo1H + 20);
        }
        director.onResize = doLayout;
        doLayout();

        app.ticker.add((ticker) => {
            const dt = ticker.deltaTime / 60;
            bg.background.tilePosition.x -= dt * 31.158;
            bg.ground.tilePosition.x -= dt * 311.58;
        });
    </script>
</body>
